# abot_vlm/config/vision.yaml
# 注意：不要在这里写 API Key；密钥放在 scripts/API_KEY.py 或环境变量 VLM_API_KEY。
# 本文件由 vlm_node.launch 加载到 top_view_shot_node 的私有命名空间下。

# 相机图像话题
image_topic: "/usb_cam/image_raw"

# 临时抓图保存路径
tmp_img_path: "/tmp/abot_vlm/vl_now.jpg"

# VLM 服务地址与模型（默认零一万物；换豆包视觉模型时改这里即可，密钥仍走本地）
base_url: "https://api.lingyiwanwu.com/v1"
model: "yi-vision"

# 请求超时（秒）与失败重试次数
timeout_s: 20.0
max_retry: 2

# 任务提示词：要求模型结构化返回 text + answer，便于 jieshou.py 解析
prompt: >
  请识别图片中的题目：先原样描述图中完整题目信息(text)，再解题。
  answer必须只填写对应的黄色格号码，且只能是31、32、33、40、41、42、49、50、51之一。
  只输出 JSON：{"text":"...","answer":"..."}，不要多余解释。
